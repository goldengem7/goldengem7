<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      @keyframes glitchEffect {
        0%, 100% { transform: translate(0); opacity: 1; }
        20% { transform: translate(-3px, 2px); opacity: 0.9; }
        40% { transform: translate(3px, -2px); opacity: 1; }
        60% { transform: translate(-2px, -1px); opacity: 0.85; }
        80% { transform: translate(2px, 3px); opacity: 1; }
      }
      @keyframes rgbSplitCyan {
        0%, 100% { transform: translate(0px, 0px); opacity: 0; }
        35% { transform: translate(-6px, 2px); opacity: 0.7; }
        70% { transform: translate(4px, -3px); opacity: 0.5; }
      }
      @keyframes rgbSplitMagenta {
        0%, 100% { transform: translate(0px, 0px); opacity: 0; }
        35% { transform: translate(6px, -2px); opacity: 0.7; }
        70% { transform: translate(-4px, 3px); opacity: 0.5; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 8px #FF0055); }
        50% { filter: drop-shadow(0 0 22px #FF0055); }
      }
      .spider-core {
        transform-origin: 200px 200px;
        animation: glitchEffect 2.8s infinite ease-in-out, pulseGlow 2s infinite ease-in-out;
      }
      .split-cyan {
        transform-origin: 200px 200px;
        animation: rgbSplitCyan 2.8s infinite ease-in-out;
      }
      .split-magenta {
        transform-origin: 200px 200px;
        animation: rgbSplitMagenta 2.8s infinite ease-in-out;
      }
    </style>

    <filter id="graffitiBlur">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Cyan RGB Glitch Ghost -->
  <g class="split-cyan" fill="#00FFFF" opacity="0.6">
    <ellipse cx="200" cy="200" rx="20" ry="42" />
    <path d="M 190 170 Q 130 90 70 80 M 190 185 Q 110 140 50 180 M 190 215 Q 110 260 50 310 M 190 230 Q 140 310 90 350" stroke="#00FFFF" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 210 170 Q 270 90 330 80 M 210 185 Q 290 140 350 180 M 210 215 Q 290 260 350 310 M 210 230 Q 260 310 310 350" stroke="#00FFFF" stroke-width="14" stroke-linecap="round" fill="none" />
  </g>

  <!-- Magenta RGB Glitch Ghost -->
  <g class="split-magenta" fill="#FF0088" opacity="0.6">
    <ellipse cx="200" cy="200" rx="20" ry="42" />
    <path d="M 190 170 Q 130 90 70 80 M 190 185 Q 110 140 50 180 M 190 215 Q 110 260 50 310 M 190 230 Q 140 310 90 350" stroke="#FF0088" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M 210 170 Q 270 90 330 80 M 210 185 Q 290 140 350 180 M 210 215 Q 290 260 350 310 M 210 230 Q 260 310 310 350" stroke="#FF0088" stroke-width="14" stroke-linecap="round" fill="none" />
  </g>

  <!-- Main Miles Morales Graffiti Spray Emblem -->
  <g class="spider-core" fill="#FF0040">
    <!-- Spray Spider Body -->
    <ellipse cx="200" cy="200" rx="22" ry="44" />
    <circle cx="200" cy="150" r="14" />

    <!-- Spider Legs (Aggressive Spray Strokes) -->
    <!-- Top Legs -->
    <path d="M 190 170 Q 130 90 70 80" stroke="#FF0040" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M 210 170 Q 270 90 330 80" stroke="#FF0040" stroke-width="15" stroke-linecap="round" fill="none" />

    <!-- Upper Middle Legs -->
    <path d="M 190 185 Q 110 140 50 180" stroke="#FF0040" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M 210 185 Q 290 140 350 180" stroke="#FF0040" stroke-width="15" stroke-linecap="round" fill="none" />

    <!-- Lower Middle Legs -->
    <path d="M 190 215 Q 110 260 50 310" stroke="#FF0040" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M 210 215 Q 290 260 350 310" stroke="#FF0040" stroke-width="15" stroke-linecap="round" fill="none" />

    <!-- Bottom Legs -->
    <path d="M 190 230 Q 140 310 90 350" stroke="#FF0040" stroke-width="15" stroke-linecap="round" fill="none" />
    <path d="M 210 230 Q 260 310 310 350" stroke="#FF0040" stroke-width="15" stroke-linecap="round" fill="none" />

    <!-- Spray Drips & Splatters -->
    <circle cx="200" cy="265" r="4" fill="#FF0040" />
    <circle cx="200" cy="285" r="2.5" fill="#FF0040" />
    <circle cx="75" cy="95" r="3" fill="#FF0040" />
    <circle cx="325" cy="95" r="3" fill="#FF0040" />
    <circle cx="45" cy="195" r="3.5" fill="#FF0040" />
    <circle cx="355" cy="195" r="3.5" fill="#FF0040" />
  </g>
</svg>
